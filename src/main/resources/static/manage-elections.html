<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Elections - Online Voting System</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="container">

        <h1>🗳️ Manage Elections</h1>

        <p>
            Create, update and manage elections.
        </p>

        <p id="message"></p>


        <!-- CREATE ELECTION -->

        <div
            style="
                border: 1px solid #ccc;
                padding: 25px;
                margin-bottom: 30px;
                border-radius: 10px;
                text-align: left;
            "
        >

            <h2>Create New Election</h2>

            <form id="createElectionForm">

                <label for="createName">
                    Election Name
                </label>

                <input
                    type="text"
                    id="createName"
                    placeholder="Enter election name"
                    required
                >


                <label for="createDescription">
                    Description
                </label>

                <textarea
                    id="createDescription"
                    placeholder="Enter election description"
                    rows="4"
                    required
                ></textarea>


                <label for="createStartDate">
                    Start Date and Time
                </label>

                <input
                    type="datetime-local"
                    id="createStartDate"
                    required
                >


                <label for="createEndDate">
                    End Date and Time
                </label>

                <input
                    type="datetime-local"
                    id="createEndDate"
                    required
                >


                <label for="createStatus">
                    Status
                </label>

                <select
                    id="createStatus"
                    required
                >

                    <option value="UPCOMING">
                        UPCOMING
                    </option>

                    <option value="ONGOING">
                        ONGOING
                    </option>

                    <option value="ENDED">
                        ENDED
                    </option>

                </select>


                <br>
                <br>


                <button type="submit">
                    Create Election
                </button>

            </form>

        </div>


        <!-- ELECTION LIST -->

        <h2>All Elections</h2>

        <div id="electionsContainer">

            <p>Loading elections...</p>

        </div>


        <br>


        <button
            onclick="window.location.href='admin.html'">
            Back to Admin Dashboard
        </button>


        <button
            onclick="logout()">
            Logout
        </button>


        <button
            onclick="window.location.href='index.html'">
            Back to Home
        </button>

    </div>


    <script>

        document
            .getElementById("createElectionForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const election = {

                        name:
                            document
                                .getElementById("createName")
                                .value
                                .trim(),

                        description:
                            document
                                .getElementById("createDescription")
                                .value
                                .trim(),

                        startDate:
                            document
                                .getElementById("createStartDate")
                                .value,

                        endDate:
                            document
                                .getElementById("createEndDate")
                                .value,

                        status:
                            document
                                .getElementById("createStatus")
                                .value
                    };


                    if (
                        new Date(election.endDate) <=
                        new Date(election.startDate)
                    ) {

                        document
                            .getElementById("message")
                            .innerText =
                            "End date must be after start date.";

                        return;
                    }


                    try {

                        const response =
                            await fetch(
                                "/api/elections",
                                {
                                    method: "POST",

                                    credentials: "include",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(election)
                                }
                            );


                        const responseText =
                            await response.text();


                        if (response.ok) {

                            document
                                .getElementById("message")
                                .innerText =
                                "Election created successfully.";

                            document
                                .getElementById("createElectionForm")
                                .reset();


                            await loadElections();

                        } else {

                            showError(
                                responseText,
                                "Unable to create election."
                            );
                        }


                    } catch (error) {

                        console.error(
                            "Create election error:",
                            error
                        );


                        document
                            .getElementById("message")
                            .innerText =
                            "Unable to connect to server.";
                    }

                }
            );


        async function loadElections() {

            try {

                const response =
                    await fetch(
                        "/api/elections",
                        {
                            credentials: "include"
                        }
                    );


                if (!response.ok) {

                    document
                        .getElementById("message")
                        .innerText =
                        "Unable to load elections.";

                    return;
                }


                const elections =
                    await response.json();


                displayElections(elections);


            } catch (error) {

                console.error(
                    "Load elections error:",
                    error
                );


                document
                    .getElementById("message")
                    .innerText =
                    "Unable to connect to server.";
            }
        }


        function displayElections(elections) {

            const container =
                document.getElementById(
                    "electionsContainer"
                );


            if (
                !elections ||
                elections.length === 0
            ) {

                container.innerHTML =
                    "<p>No elections found.</p>";

                return;
            }


            let html = "";


            elections.forEach(
                function(election) {

                    html += `

                        <div
                            style="
                                border: 1px solid #ccc;
                                padding: 25px;
                                margin-bottom: 25px;
                                border-radius: 10px;
                                text-align: left;
                            "
                        >

                            <h3>
                                Election ID:
                                ${election.id}
                            </h3>


                            <label>
                                Election Name
                            </label>

                            <input
                                type="text"
                                id="name-${election.id}"
                                value="${escapeHtml(
                                    election.name || ""
                                )}"
                            >


                            <label>
                                Description
                            </label>

                            <textarea
                                id="description-${election.id}"
                                rows="4"
                            >${escapeHtml(
                                election.description || ""
                            )}</textarea>


                            <label>
                                Start Date and Time
                            </label>

                            <input
                                type="datetime-local"
                                id="startDate-${election.id}"
                                value="${formatDateTimeLocal(
                                    election.startDate
                                )}"
                            >


                            <label>
                                End Date and Time
                            </label>

                            <input
                                type="datetime-local"
                                id="endDate-${election.id}"
                                value="${formatDateTimeLocal(
                                    election.endDate
                                )}"
                            >


                            <label>
                                Status
                            </label>

                            <select
                                id="status-${election.id}"
                            >

                                <option
                                    value="UPCOMING"
                                    ${election.status === "UPCOMING"
                                        ? "selected"
                                        : ""}
                                >
                                    UPCOMING
                                </option>

                                <option
                                    value="ONGOING"
                                    ${election.status === "ONGOING"
                                        ? "selected"
                                        : ""}
                                >
                                    ONGOING
                                </option>

                                <option
                                    value="ENDED"
                                    ${election.status === "ENDED"
                                        ? "selected"
                                        : ""}
                                >
                                    ENDED
                                </option>

                            </select>


                            <p>
                                <strong>
                                    Current Status:
                                </strong>

                                ${election.status || "Unknown"}
                            </p>


                            <button
                                onclick="updateElection(${election.id})">
                                Update
                            </button>


                            <button
                                onclick="deleteElection(${election.id})">
                                Delete
                            </button>

                        </div>

                    `;
                }
            );


            container.innerHTML =
                html;
        }


        async function updateElection(id) {

            const name =
                document
                    .getElementById(`name-${id}`)
                    .value
                    .trim();


            const description =
                document
                    .getElementById(`description-${id}`)
                    .value
                    .trim();


            const startDate =
                document
                    .getElementById(`startDate-${id}`)
                    .value;


            const endDate =
                document
                    .getElementById(`endDate-${id}`)
                    .value;


            const status =
                document
                    .getElementById(`status-${id}`)
                    .value;


            if (
                new Date(endDate) <=
                new Date(startDate)
            ) {

                document
                    .getElementById("message")
                    .innerText =
                    "End date must be after start date.";

                return;
            }


            const election = {

                name: name,

                description: description,

                startDate: startDate,

                endDate: endDate,

                status: status
            };


            try {

                const response =
                    await fetch(
                        `/api/elections/${id}`,
                        {
                            method: "PUT",

                            credentials: "include",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(election)
                        }
                    );


                const responseText =
                    await response.text();


                if (response.ok) {

                    document
                        .getElementById("message")
                        .innerText =
                        "Election updated successfully.";

                    await loadElections();

                } else {

                    showError(
                        responseText,
                        "Unable to update election."
                    );
                }


            } catch (error) {

                console.error(
                    "Update election error:",
                    error
                );


                document
                    .getElementById("message")
                    .innerText =
                    "Unable to connect to server.";
            }
        }


        async function deleteElection(id) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this election?"
                );


            if (!confirmed) {

                return;
            }


            try {

                const response =
                    await fetch(
                        `/api/elections/${id}`,
                        {
                            method: "DELETE",

                            credentials: "include"
                        }
                    );


                const responseText =
                    await response.text();


                if (response.ok) {

                    document
                        .getElementById("message")
                        .innerText =
                        "Election deleted successfully.";

                    await loadElections();

                } else {

                    showError(
                        responseText,
                        "Unable to delete election."
                    );
                }


            } catch (error) {

                console.error(
                    "Delete election error:",
                    error
                );


                document
                    .getElementById("message")
                    .innerText =
                    "Unable to connect to server.";
            }
        }


        function formatDateTimeLocal(dateValue) {

            if (!dateValue) {

                return "";
            }


            const date =
                new Date(dateValue);


            if (isNaN(date.getTime())) {

                return "";
            }


            const year =
                date.getFullYear();


            const month =
                String(
                    date.getMonth() + 1
                ).padStart(2, "0");


            const day =
                String(
                    date.getDate()
                ).padStart(2, "0");


            const hours =
                String(
                    date.getHours()
                ).padStart(2, "0");


            const minutes =
                String(
                    date.getMinutes()
                ).padStart(2, "0");


            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }


        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        function showError(
            responseText,
            defaultMessage
        ) {

            let errorMessage =
                responseText;


            try {

                const data =
                    JSON.parse(responseText);


                errorMessage =
                    data.message ||
                    data.error ||
                    responseText;

            } catch (error) {

                // Server returned plain text.
            }


            document
                .getElementById("message")
                .innerText =
                errorMessage ||
                defaultMessage;
        }


        async function logout() {

            try {

                await fetch(
                    "/api/auth/logout",
                    {
                        method: "POST",
                        credentials: "include"
                    }
                );

            } catch (error) {

                console.error(
                    "Logout error:",
                    error
                );

            } finally {

                window.location.href =
                    "login.html";
            }
        }


        loadElections();

    </script>

</body>

</html>
