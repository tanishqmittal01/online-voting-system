<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Users - Online Voting System</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="container">

        <h1>👥 Manage Users</h1>

        <p>
            Manage registered voters and administrators.
        </p>

        <p id="message"></p>


        <div id="usersContainer">

            <p>Loading users...</p>

        </div>


        <br>


        <button
            onclick="window.location.href='admin.html'">
            Back to Admin Dashboard
        </button>


        <button
            onclick="logout()">
            Logout
        </button>


        <button
            onclick="window.location.href='index.html'">
            Back to Home
        </button>

    </div>


    <script>

        async function loadUsers() {

            try {

                const response =
                    await fetch(
                        "/api/users",
                        {
                            credentials: "include"
                        }
                    );


                if (!response.ok) {

                    if (response.status === 403) {

                        document
                            .getElementById("message")
                            .innerText =
                            "Access denied. Admin access required.";

                    } else {

                        document
                            .getElementById("message")
                            .innerText =
                            "Unable to load users.";

                    }

                    return;
                }


                const users =
                    await response.json();


                displayUsers(users);


            } catch (error) {

                console.error(
                    "Load users error:",
                    error
                );


                document
                    .getElementById("message")
                    .innerText =
                    "Unable to connect to server.";
            }
        }


        function displayUsers(users) {

            const container =
                document.getElementById(
                    "usersContainer"
                );


            if (
                !users ||
                users.length === 0
            ) {

                container.innerHTML =
                    "<p>No users found.</p>";

                return;
            }


            let html = "";


            users.forEach(function(user) {

                html += `

                    <div
                        style="
                            border: 1px solid #ccc;
                            padding: 25px;
                            margin-bottom: 25px;
                            border-radius: 10px;
                            text-align: left;
                        "
                    >

                        <h3>
                            User ID: ${user.id}
                        </h3>


                        <p>
                            <strong>Voter ID:</strong>
                            ${escapeHtml(
                                user.voterId ||
                                "Not assigned"
                            )}
                        </p>


                        <div
                            style="
                                display: grid;
                                grid-template-columns:
                                    repeat(
                                        2,
                                        minmax(250px, 1fr)
                                    );
                                gap: 18px;
                                align-items: end;
                            "
                        >

                            <div>

                                <label
                                    for="name-${user.id}"
                                >
                                    Name
                                </label>

                                <input
                                    type="text"
                                    id="name-${user.id}"
                                    value="${escapeHtml(
                                        user.name || ""
                                    )}"
                                    placeholder="Enter name"
                                    style="
                                        width: 100%;
                                        box-sizing: border-box;
                                    "
                                >

                            </div>


                            <div>

                                <label
                                    for="studentId-${user.id}"
                                >
                                    Student ID
                                </label>

                                <input
                                    type="text"
                                    id="studentId-${user.id}"
                                    value="${escapeHtml(
                                        user.studentId || ""
                                    )}"
                                    placeholder="Enter Student ID"
                                    style="
                                        width: 100%;
                                        box-sizing: border-box;
                                    "
                                >

                            </div>


                            <div>

                                <label
                                    for="email-${user.id}"
                                >
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="email-${user.id}"
                                    value="${escapeHtml(
                                        user.email || ""
                                    )}"
                                    placeholder="Enter email"
                                    style="
                                        width: 100%;
                                        box-sizing: border-box;
                                    "
                                >

                            </div>


                            <div>

                                <label
                                    for="role-${user.id}"
                                >
                                    Role
                                </label>

                                <select
                                    id="role-${user.id}"
                                    style="
                                        width: 100%;
                                        box-sizing: border-box;
                                    "
                                >

                                    <option
                                        value="VOTER"
                                        ${
                                            user.role === "VOTER"
                                                ? "selected"
                                                : ""
                                        }
                                    >
                                        VOTER
                                    </option>


                                    <option
                                        value="ADMIN"
                                        ${
                                            user.role === "ADMIN"
                                                ? "selected"
                                                : ""
                                        }
                                    >
                                        ADMIN
                                    </option>

                                </select>

                            </div>


                            <div>

                                <label
                                    for="password-${user.id}"
                                >
                                    New Password
                                </label>

                                <input
                                    type="password"
                                    id="password-${user.id}"
                                    placeholder="Leave blank to keep current password"
                                    style="
                                        width: 100%;
                                        box-sizing: border-box;
                                    "
                                >

                            </div>

                        </div>


                        <br>


                        <button
                            onclick="updateUser(${user.id})">
                            Update User
                        </button>


                        <button
                            onclick="deleteUser(${user.id})">
                            Delete User
                        </button>

                    </div>

                `;

            });


            container.innerHTML =
                html;
        }


        async function updateUser(id) {

            const name =
                document
                    .getElementById(
                        `name-${id}`
                    )
                    .value
                    .trim();


            const studentId =
                document
                    .getElementById(
                        `studentId-${id}`
                    )
                    .value
                    .trim();


            const email =
                document
                    .getElementById(
                        `email-${id}`
                    )
                    .value
                    .trim();


            const role =
                document
                    .getElementById(
                        `role-${id}`
                    )
                    .value;


            const password =
                document
                    .getElementById(
                        `password-${id}`
                    )
                    .value;


            if (!name) {

                document
                    .getElementById("message")
                    .innerText =
                    "Name is required.";

                return;
            }


            if (!email) {

                document
                    .getElementById("message")
                    .innerText =
                    "Email is required.";

                return;
            }


            const user = {

                name: name,

                studentId: studentId,

                email: email,

                role: role
            };


            if (password.trim() !== "") {

                user.password =
                    password;
            }


            try {

                const response =
                    await fetch(
                        `/api/users/${id}`,
                        {
                            method: "PUT",

                            credentials: "include",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(user)
                        }
                    );


                const responseText =
                    await response.text();


                if (response.ok) {

                    document
                        .getElementById("message")
                        .innerText =
                        "User updated successfully.";

                    await loadUsers();

                } else {

                    showError(
                        responseText,
                        "Unable to update user."
                    );
                }


            } catch (error) {

                console.error(
                    "Update user error:",
                    error
                );


                document
                    .getElementById("message")
                    .innerText =
                    "Unable to connect to server.";
            }
        }


        async function deleteUser(id) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this user?"
                );


            if (!confirmed) {

                return;
            }


            try {

                const response =
                    await fetch(
                        `/api/users/${id}`,
                        {
                            method: "DELETE",

                            credentials: "include"
                        }
                    );


                const responseText =
                    await response.text();


                if (response.ok) {

                    document
                        .getElementById("message")
                        .innerText =
                        "User deleted successfully.";

                    await loadUsers();

                } else {

                    showError(
                        responseText,
                        "Unable to delete user."
                    );
                }


            } catch (error) {

                console.error(
                    "Delete user error:",
                    error
                );


                document
                    .getElementById("message")
                    .innerText =
                    "Unable to connect to server.";
            }
        }


        function escapeHtml(value) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );
        }


        function showError(
            responseText,
            defaultMessage
        ) {

            let errorMessage =
                responseText;


            try {

                const data =
                    JSON.parse(
                        responseText
                    );


                errorMessage =
                    data.message ||
                    data.error ||
                    responseText;

            } catch (error) {

                // Server returned plain text.
            }


            document
                .getElementById("message")
                .innerText =
                errorMessage ||
                defaultMessage;
        }


        async function logout() {

            try {

                await fetch(
                    "/api/auth/logout",
                    {
                        method: "POST",
                        credentials: "include"
                    }
                );

            } catch (error) {

                console.error(
                    "Logout error:",
                    error
                );

            } finally {

                window.location.href =
                    "login.html";
            }
        }


        loadUsers();

    </script>

</body>

</html>
